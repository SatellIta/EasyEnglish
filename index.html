<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e0e5ec" />
    <title>EasyEnglish · 沉浸式英语学习</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('easyenglish.theme') === 'swiss' ? 'swiss' : 'neumorphism'
          var mode = localStorage.getItem('easyenglish.colorMode') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.mode = mode
          var chromeColor = theme === 'swiss'
            ? (mode === 'dark' ? '#111111' : '#ffffff')
            : (mode === 'dark' ? '#22262c' : '#e0e5ec')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', chromeColor)
          var locale = localStorage.getItem('easyenglish.locale')
          document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN'
        } catch (error) {
          document.documentElement.dataset.theme = 'neumorphism'
          document.documentElement.dataset.mode = 'light'
          document.documentElement.lang = 'zh-CN'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
